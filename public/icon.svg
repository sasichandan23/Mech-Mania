<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#161c28"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#f59e0b" stroke-width="6" opacity="0.4"/>
  <!-- Central Gear -->
  <g transform="translate(256, 256)">
    <!-- Gear teeth -->
    <path d="M -30,-180 L 30,-180 L 38,-140 L -38,-140 Z" fill="url(#gold)"/>
    <path d="M -30,-180 L 30,-180 L 38,-140 L -38,-140 Z" fill="url(#gold)" transform="rotate(45)"/>
    <path d="M -30,-180 L 30,-180 L 38,-140 L -38,-140 Z" fill="url(#gold)" transform="rotate(90)"/>
    <path d="M -30,-180 L 30,-180 L 38,-140 L -38,-140 Z" fill="url(#gold)" transform="rotate(135)"/>
    <path d="M -30,-180 L 30,-180 L 38,-140 L -38,-140 Z" fill="url(#gold)" transform="rotate(180)"/>
    <path d="M -30,-180 L 30,-180 L 38,-140 L -38,-140 Z" fill="url(#gold)" transform="rotate(225)"/>
    <path d="M -30,-180 L 30,-180 L 38,-140 L -38,-140 Z" fill="url(#gold)" transform="rotate(270)"/>
    <path d="M -30,-180 L 30,-180 L 38,-140 L -38,-140 Z" fill="url(#gold)" transform="rotate(315)"/>
    <!-- Outer Gear Circle -->
    <circle r="145" fill="url(#gold)"/>
    <!-- Cutout Circle -->
    <circle r="95" fill="#0d111a"/>
    <!-- Center Hub -->
    <circle r="48" fill="url(#gold)"/>
    <circle r="24" fill="#0d111a"/>
  </g>
</svg>
